services:
  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/incidents.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - incidentmind-data:/data
    restart: unless-stopped

  dashboard:
    build: .
    env_file:
      - .env
    environment:
      INCIDENTMIND_API_URL: http://api:8000
      DATABASE_URL: sqlite:////data/incidents.sqlite3
    command: ["streamlit", "run", "frontend/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  incidentmind-data:
